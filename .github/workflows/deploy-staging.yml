name: Deploy staging

on:
  push:
    branches: [deploy_staging]
  workflow_dispatch:
    inputs:
      force_all:
        description: Force full migrate + deploy:all (ignore git diff)
        type: boolean
        default: false
      services:
        description: Comma-separated service keys (identity,webonone,media,...) - skips auto-detect
        type: string
        required: false
        default: ''

concurrency:
  group: staging-deploy
  cancel-in-progress: false

# Windows PowerShell 5.1 (shell: powershell) reads GitHub's temp .ps1 as
# Windows-1252. Keep every run: script ASCII-only: an em dash (UTF-8 E2 80 94)
# is read as a smart quote and yields "string is missing the terminator".

jobs:
  deploy:
    name: Deploy to IIS
    runs-on: [self-hosted, Windows, webonone-staging]
    timeout-minutes: 180

    env:
      DEPLOY_REPO_ROOT: ${{ vars.DEPLOY_REPO_ROOT }}
      DEPLOY_BRANCH: deploy_staging

    steps:
      - name: Require DEPLOY_REPO_ROOT
        shell: powershell
        run: |
          if (-not $env:DEPLOY_REPO_ROOT) {
            throw 'Set repository variable DEPLOY_REPO_ROOT (e.g. C:\Projects\webonone_v2). See tooling/CICD.md'
          }
          if (-not (Test-Path -LiteralPath $env:DEPLOY_REPO_ROOT)) {
            throw "DEPLOY_REPO_ROOT does not exist: $env:DEPLOY_REPO_ROOT"
          }

      - name: Preflight production.env
        shell: powershell
        run: |
          $envFile = Join-Path $env:DEPLOY_REPO_ROOT 'production.env'
          if (-not (Test-Path -LiteralPath $envFile)) {
            throw "Missing production.env at $envFile. Copy from production.env.example"
          }

      - name: Locate Git for Windows
        shell: powershell
        run: |
          $machinePath = [System.Environment]::GetEnvironmentVariable('Path', 'Machine')
          $userPath = [System.Environment]::GetEnvironmentVariable('Path', 'User')
          $env:Path = "$machinePath;$userPath;$env:Path"

          $gitExe = $null
          $gitCmd = Get-Command git.exe -ErrorAction SilentlyContinue
          if ($gitCmd) {
            $gitExe = $gitCmd.Source
          }
          if (-not $gitExe) {
            foreach ($candidate in @(
              'C:\Program Files\Git\cmd\git.exe',
              'C:\Program Files (x86)\Git\cmd\git.exe'
            )) {
              if (Test-Path -LiteralPath $candidate) {
                $gitExe = $candidate
                break
              }
            }
          }
          if (-not $gitExe) {
            throw 'git.exe not found. Install Git for Windows and restart the GitHub Actions runner service.'
          }

          $gitDir = Split-Path -Parent $gitExe
          $gitDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Using git: $gitExe"
          & $gitExe --version

      - name: Trust git checkout directory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $listed = @(git config --global --get-all safe.directory 2>$null)
          $ErrorActionPreference = 'Stop'
          $global:LASTEXITCODE = 0

          $toAdd = @('*')
          $current = $env:DEPLOY_REPO_ROOT.TrimEnd('\')
          while ($current) {
            $toAdd += ($current -replace '\\', '/')
            $parent = Split-Path -Parent $current
            if (-not $parent -or $parent -eq $current) { break }
            $current = $parent
          }

          foreach ($value in $toAdd) {
            if ($listed -contains $value) { continue }
            git config --global --add safe.directory $value
            if ($LASTEXITCODE -ne 0) {
              throw "git config --global --add safe.directory failed for $value"
            }
            $listed += $value
          }

      - name: Require write access to clone
        shell: powershell
        run: |
          $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          $gitDir = Join-Path $env:DEPLOY_REPO_ROOT '.git'
          if (-not (Test-Path -LiteralPath $gitDir)) {
            throw "Not a git repository: $env:DEPLOY_REPO_ROOT"
          }
          $probe = Join-Path $gitDir 'actions-write-probe'
          try {
            [System.IO.File]::WriteAllText($probe, 'ok')
            Remove-Item -LiteralPath $probe -Force
          } catch {
            throw "Runner account '$identity' cannot write under $gitDir. Grant Modify on DEPLOY_REPO_ROOT (including .git) to that account, or run the Actions runner service as the user who owns the clone. See tooling/CICD.md"
          }
          Write-Host "Write probe ok as $identity"

      - name: Sync deploy_staging branch
        id: sync
        shell: powershell
        working-directory: ${{ env.DEPLOY_REPO_ROOT }}
        run: |
          $before = (git rev-parse HEAD 2>$null)
          if (-not $before) { $before = '' }
          git fetch origin $env:DEPLOY_BRANCH
          git checkout --force -B $env:DEPLOY_BRANCH "origin/$($env:DEPLOY_BRANCH)"
          $after = (git rev-parse HEAD)
          Add-Content -Path $env:GITHUB_OUTPUT -Value "before_sha=$before"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "after_sha=$after"
          Write-Host "Synced $env:DEPLOY_BRANCH before=$before after=$after"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # npm ci deletes node_modules and fails with EPERM while IIS Node has
      # native DLLs loaded (sharp/libvips). NETWORK SERVICE cannot stop IIS
      # app pools (redirection.config). Use npm install in place instead.
      - name: Install dependencies
        working-directory: ${{ env.DEPLOY_REPO_ROOT }}
        shell: cmd
        run: npm install

      - name: Detect deploy targets
        id: detect
        working-directory: ${{ env.DEPLOY_REPO_ROOT }}
        shell: powershell
        env:
          INPUT_FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_all }}
          INPUT_SERVICES: ${{ github.event_name == 'workflow_dispatch' && inputs.services || '' }}
          PUSH_BEFORE: ${{ github.event.before }}
          SYNC_BEFORE: ${{ steps.sync.outputs.before_sha }}
          SYNC_AFTER: ${{ steps.sync.outputs.after_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:INPUT_FORCE_ALL -eq 'true') {
            node tooling/detect-changed-services.mjs --force-all --github-output
            exit $LASTEXITCODE
          }
          if ($env:INPUT_SERVICES -and $env:INPUT_SERVICES.Trim().Length -gt 0) {
            node tooling/detect-changed-services.mjs --services $env:INPUT_SERVICES --github-output
            exit $LASTEXITCODE
          }
          $base = $env:PUSH_BEFORE
          if (-not $base -or $base -match '^0+$') {
            $base = $env:SYNC_BEFORE
          }
          if (-not $base -or $base -match '^0+$') {
            Write-Host 'No usable base SHA; forcing full deploy'
            node tooling/detect-changed-services.mjs --force-all --github-output
            exit $LASTEXITCODE
          }
          node tooling/detect-changed-services.mjs --base $base --head $env:SYNC_AFTER --github-output
          exit $LASTEXITCODE

      - name: Apply production.env
        if: steps.detect.outputs.mode != 'none'
        working-directory: ${{ env.DEPLOY_REPO_ROOT }}
        shell: cmd
        run: npm run env:apply

      - name: Migrate and deploy (changed or all)
        if: steps.detect.outputs.mode != 'none'
        working-directory: ${{ env.DEPLOY_REPO_ROOT }}
        shell: powershell
        env:
          DEPLOY_MODE: ${{ steps.detect.outputs.mode }}
          DEPLOY_SERVICES: ${{ steps.detect.outputs.services }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:DEPLOY_MODE -eq 'all') {
            node tooling/deploy-changed.mjs --all
          } else {
            node tooling/deploy-changed.mjs --services $env:DEPLOY_SERVICES
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Skip deploy (no service changes)
        if: steps.detect.outputs.mode == 'none'
        shell: powershell
        run: |
          Write-Host "Detect mode=none ($env:DETECT_REASON). Skipping env:apply, migrate, deploy, recycle, and smoke."
        env:
          DETECT_REASON: ${{ steps.detect.outputs.reason }}

      # Node/iisnode may still serve old workers until pools recycle (email often hangs until then).
      - name: Recycle IIS app pools (before smoke)
        if: steps.detect.outputs.mode != 'none'
        continue-on-error: true
        working-directory: ${{ env.DEPLOY_REPO_ROOT }}
        shell: powershell
        env:
          IIS_APP_POOLS_JSON: ${{ vars.IIS_APP_POOLS_JSON }}
          DETECT_MODE: ${{ steps.detect.outputs.mode }}
          DETECT_APP_POOLS: ${{ steps.detect.outputs.app_pools }}
        run: |
          if ($env:IIS_APP_POOLS_JSON -and -not (Test-Path -LiteralPath $env:IIS_APP_POOLS_JSON)) {
            Write-Warning "IIS_APP_POOLS_JSON path not found: $env:IIS_APP_POOLS_JSON"
          }
          if ($env:DETECT_MODE -eq 'selective' -and $env:DETECT_APP_POOLS) {
            $env:IIS_APP_POOLS = $env:DETECT_APP_POOLS
            Write-Host "Selective recycle pools: $env:IIS_APP_POOLS"
          }
          npm run recycle:iis
          if ($LASTEXITCODE -ne 0) {
            Write-Warning 'IIS recycle failed or skipped (runner may lack appcmd rights). Recycle pools manually if smoke fails.'
          }

      - name: Wait for health endpoints after recycle
        if: steps.detect.outputs.mode != 'none'
        shell: powershell
        run: Start-Sleep -Seconds 30

      - name: Smoke health checks
        if: steps.detect.outputs.mode != 'none'
        working-directory: ${{ env.DEPLOY_REPO_ROOT }}
        shell: powershell
        env:
          REPO_SMOKE_HEALTH_URLS: ${{ vars.SMOKE_HEALTH_URLS }}
          SMOKE_HEALTH_RETRIES: ${{ vars.SMOKE_HEALTH_RETRIES }}
          DETECT_MODE: ${{ steps.detect.outputs.mode }}
          DETECT_SERVICES: ${{ steps.detect.outputs.services }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:DETECT_MODE -eq 'selective' -and $env:DETECT_SERVICES) {
            $env:SMOKE_HEALTH_URLS = $env:REPO_SMOKE_HEALTH_URLS
            $resolved = node tooling/resolve-smoke-urls.mjs --services $env:DETECT_SERVICES
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:SMOKE_HEALTH_URLS = "$resolved"
            Write-Host "Selective smoke URLs: $env:SMOKE_HEALTH_URLS"
          } elseif ($env:REPO_SMOKE_HEALTH_URLS) {
            $env:SMOKE_HEALTH_URLS = $env:REPO_SMOKE_HEALTH_URLS
          }
          $script = Join-Path $env:DEPLOY_REPO_ROOT 'tooling\smoke-production-health.ps1'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
