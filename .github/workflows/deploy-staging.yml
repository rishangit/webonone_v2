name: Deploy staging

on:
  push:
    branches: [deploy_staging]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: false

# Windows PowerShell 5.1 (shell: powershell) reads GitHub's temp .ps1 as
# Windows-1252. Keep every run: script ASCII-only: an em dash (UTF-8 E2 80 94)
# is read as a smart quote and yields "string is missing the terminator".

jobs:
  deploy:
    name: Deploy to IIS
    runs-on: [self-hosted, Windows, webonone-staging]
    timeout-minutes: 180

    env:
      DEPLOY_REPO_ROOT: ${{ vars.DEPLOY_REPO_ROOT }}
      DEPLOY_BRANCH: deploy_staging

    steps:
      - name: Require DEPLOY_REPO_ROOT
        shell: powershell
        run: |
          if (-not $env:DEPLOY_REPO_ROOT) {
            throw 'Set repository variable DEPLOY_REPO_ROOT (e.g. C:\Projects\webonone_v2). See tooling/CICD.md'
          }
          if (-not (Test-Path -LiteralPath $env:DEPLOY_REPO_ROOT)) {
            throw "DEPLOY_REPO_ROOT does not exist: $env:DEPLOY_REPO_ROOT"
          }

      - name: Preflight production.env
        shell: powershell
        run: |
          $envFile = Join-Path $env:DEPLOY_REPO_ROOT 'production.env'
          if (-not (Test-Path -LiteralPath $envFile)) {
            throw "Missing production.env at $envFile. Copy from production.env.example"
          }

      - name: Locate Git for Windows
        shell: powershell
        run: |
          $machinePath = [System.Environment]::GetEnvironmentVariable('Path', 'Machine')
          $userPath = [System.Environment]::GetEnvironmentVariable('Path', 'User')
          $env:Path = "$machinePath;$userPath;$env:Path"

          $gitExe = $null
          $gitCmd = Get-Command git.exe -ErrorAction SilentlyContinue
          if ($gitCmd) {
            $gitExe = $gitCmd.Source
          }
          if (-not $gitExe) {
            foreach ($candidate in @(
              'C:\Program Files\Git\cmd\git.exe',
              'C:\Program Files (x86)\Git\cmd\git.exe'
            )) {
              if (Test-Path -LiteralPath $candidate) {
                $gitExe = $candidate
                break
              }
            }
          }
          if (-not $gitExe) {
            throw 'git.exe not found. Install Git for Windows and restart the GitHub Actions runner service.'
          }

          $gitDir = Split-Path -Parent $gitExe
          $gitDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Using git: $gitExe"
          & $gitExe --version

      - name: Trust git checkout directory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $listed = @(git config --global --get-all safe.directory 2>$null)
          $ErrorActionPreference = 'Stop'
          $global:LASTEXITCODE = 0

          $toAdd = @('*')
          $current = $env:DEPLOY_REPO_ROOT.TrimEnd('\')
          while ($current) {
            $toAdd += ($current -replace '\\', '/')
            $parent = Split-Path -Parent $current
            if (-not $parent -or $parent -eq $current) { break }
            $current = $parent
          }

          foreach ($value in $toAdd) {
            if ($listed -contains $value) { continue }
            git config --global --add safe.directory $value
            if ($LASTEXITCODE -ne 0) {
              throw "git config --global --add safe.directory failed for $value"
            }
            $listed += $value
          }

      - name: Require write access to clone
        shell: powershell
        run: |
          $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          $gitDir = Join-Path $env:DEPLOY_REPO_ROOT '.git'
          if (-not (Test-Path -LiteralPath $gitDir)) {
            throw "Not a git repository: $env:DEPLOY_REPO_ROOT"
          }
          $probe = Join-Path $gitDir 'actions-write-probe'
          try {
            [System.IO.File]::WriteAllText($probe, 'ok')
            Remove-Item -LiteralPath $probe -Force
          } catch {
            throw "Runner account '$identity' cannot write under $gitDir. Grant Modify on DEPLOY_REPO_ROOT (including .git) to that account, or run the Actions runner service as the user who owns the clone. See tooling/CICD.md"
          }
          Write-Host "Write probe ok as $identity"

      - name: Sync deploy_staging branch
        shell: powershell
        working-directory: ${{ env.DEPLOY_REPO_ROOT }}
        run: |
          git fetch origin $env:DEPLOY_BRANCH
          git checkout --force -B $env:DEPLOY_BRANCH "origin/$($env:DEPLOY_BRANCH)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # npm ci deletes node_modules and fails with EPERM while IIS Node has
      # native DLLs loaded (sharp/libvips). NETWORK SERVICE cannot stop IIS
      # app pools (redirection.config). Use npm install in place instead.
      - name: Install dependencies
        working-directory: ${{ env.DEPLOY_REPO_ROOT }}
        shell: cmd
        run: npm install

      - name: Apply production.env
        working-directory: ${{ env.DEPLOY_REPO_ROOT }}
        shell: cmd
        run: npm run env:apply

      - name: Run migrations
        working-directory: ${{ env.DEPLOY_REPO_ROOT }}
        shell: cmd
        run: npm run migrate:all

      - name: Build and stage deploy
        working-directory: ${{ env.DEPLOY_REPO_ROOT }}
        shell: cmd
        run: npm run deploy:all

      - name: Smoke health checks
        working-directory: ${{ env.DEPLOY_REPO_ROOT }}
        shell: powershell
        env:
          SMOKE_HEALTH_URLS: ${{ vars.SMOKE_HEALTH_URLS }}
        run: |
          $script = Join-Path $env:DEPLOY_REPO_ROOT 'tooling\smoke-production-health.ps1'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script
